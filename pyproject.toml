[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slingology-eis"
version = "0.28.0"
description = "Free, open-source engine health analytics for Rotax iS FADEC-controlled aircraft engines"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

# Housekeeping (Spec 04 finding 1): only pandas and numpy are actually
# imported anywhere in slingology_eis/ or notebooks/ — everything else
# requirements.txt used to list unconditionally is optional tooling.
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]
notebooks = [
    "jupytext>=1.14",
    "jupyter>=1.0",
    "matplotlib>=3.7",
]

[project.scripts]
slingology-eis = "slingology_eis.cli:main"

[tool.setuptools.packages.find]
include = ["slingology_eis*"]

[tool.setuptools.package-data]
# Spec 01 §8.8: topic help is product content needed at runtime (CLI,
# server, notebooks), not a design document — it ships inside the
# package. docs/specs/topics/register.json is not declared here: it's
# resolved the same repo-root-relative way engines/*.json already is
# (limits.py's _TOOLKIT_ROOT), since it lives outside the slingology_eis/
# tree by design (Spec 10 §5) — true package data for it is the same
# unresolved gap engines/*.json already has for a genuinely installed
# wheel, not a new one.
slingology_eis = ["help/topics.md"]
