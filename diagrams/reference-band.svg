<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" role="img" aria-label="One metric plotted over engine hours. A shaded band marks your usual range, average plus or minus one standard deviation. Most flights sit inside it; one flight far above the band is an outlier, more than two standard deviations from your average." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- axes -->
  <line x1="60" y1="200" x2="730" y2="200" stroke="currentColor" stroke-width="1" marker-end="url(#arr3)"/>
  <line x1="60" y1="200" x2="60" y2="20" stroke="currentColor" stroke-width="1" marker-end="url(#arr3)"/>
  <text x="700" y="218" text-anchor="end" opacity="0.7">engine hours</text>
  <text x="18" y="30" opacity="0.7">metric</text>

  <!-- band: mean 120, sigma 22 -->
  <rect x="60" y="98" width="660" height="44" fill="#14b8a6" opacity="0.18"/>
  <line x1="60" y1="120" x2="720" y2="120" stroke="#14b8a6" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="724" y="124" opacity="0.8">your average</text>
  <text x="724" y="103" opacity="0.6">+1σ</text>
  <text x="724" y="146" opacity="0.6">−1σ</text>

  <!-- 2 sigma lines -->
  <line x1="60" y1="76" x2="720" y2="76" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="60" y1="164" x2="720" y2="164" stroke="currentColor" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.6"/>
  <text x="724" y="80" opacity="0.6">+2σ: unusual</text>
  <text x="724" y="168" opacity="0.6">−2σ: unusual</text>

  <!-- flights -->
  <g fill="currentColor" opacity="0.85">
    <circle cx="90" cy="124" r="3.5"/><circle cx="120" cy="112" r="3.5"/><circle cx="150" cy="130" r="3.5"/>
    <circle cx="180" cy="118" r="3.5"/><circle cx="210" cy="108" r="3.5"/><circle cx="240" cy="126" r="3.5"/>
    <circle cx="270" cy="115" r="3.5"/><circle cx="300" cy="136" r="3.5"/><circle cx="330" cy="121" r="3.5"/>
    <circle cx="360" cy="104" r="3.5"/><circle cx="390" cy="128" r="3.5"/><circle cx="420" cy="117" r="3.5"/>
    <circle cx="480" cy="111" r="3.5"/><circle cx="510" cy="132" r="3.5"/><circle cx="540" cy="119" r="3.5"/>
    <circle cx="570" cy="125" r="3.5"/><circle cx="600" cy="109" r="3.5"/><circle cx="630" cy="122" r="3.5"/>
    <circle cx="660" cy="116" r="3.5"/><circle cx="690" cy="129" r="3.5"/>
  </g>
  <!-- outlier -->
  <circle cx="450" cy="52" r="5" fill="#ef4444"/>
  <circle cx="450" cy="52" r="9" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="464" y="48" font-weight="600">this flight: outside your usual</text>
  <text x="464" y="62" opacity="0.7">→ an insight on its card</text>

  <!-- n note -->
  <text x="66" y="192" opacity="0.6">reference = all your other flights in similar conditions (at least 10)</text>
</svg>
