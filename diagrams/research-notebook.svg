<text x="60" y="137" font-size="10" opacity="0.85">What it means — a hypothesis, how sure, what would change it</text>
<text x="48" y="160" font-size="10.5"><tspan font-weight="600">3 Proposed actions</tspan> — what · who · what it settles · or <tspan font-style="italic">None</tspan></text>
<text x="38" y="194" font-weight="600">4 Findings</text>
<text x="38" y="209" opacity="0.85" font-size="10.5">The cycle is there on every takeoff, not one flight.</text>
