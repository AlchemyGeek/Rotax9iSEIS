<path d="M50,246 L62,232 L74,260 L86,232 L98,260 L110,232 L122,260 L134,232 L146,260 L158,232 L170,260 L182,232 L194,260 L206,232 L218,260 L230,232 L242,260 L254,232 L266,260 L278,232 L290,246" fill="none" stroke="#14b8a6" stroke-width="1.4"/>
