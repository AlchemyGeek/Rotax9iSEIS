<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-label="An investigation notebook in its seven sections. A header with the title, who wrote it, whether it is finished and whether its outputs are current. Then the Answer, read first: 1 the question and its scope, 2 what the data shows and what it means, 3 proposed actions with who would do each and what it would settle. Then 4 Findings: each a sentence with its numbered, captioned table, figure or log view, the calculation folded. Then 5 how this was done, 6 dated follow-ups, and 7 Working, the exploring, folded. The same file opens on the Research page, in JupyterLab, and as an exported page." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor">
<defs><marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="16" width="460" height="420" rx="8" fill="currentColor" opacity="0.05"/>
