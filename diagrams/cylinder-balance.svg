<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Four lines over engine hours, one per cylinder, each showing that cylinder's cruise EGT minus the mean of the other three. Cylinders 1 to 3 run flat and parallel; cylinder 4 runs higher, as usual on a turbo engine, and then drifts further up in the last part of the history." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <line x1="60" y1="190" x2="730" y2="190" stroke="currentColor" stroke-width="1" marker-end="url(#arr6)"/>
  <line x1="60" y1="190" x2="60" y2="20" stroke="currentColor" stroke-width="1" marker-end="url(#arr6)"/>
  <text x="700" y="208" text-anchor="end" opacity="0.7">engine hours</text>
  <text x="18" y="30" opacity="0.7">°F vs</text>
  <text x="18" y="42" opacity="0.7">others</text>
  <!-- zero line -->
  <line x1="60" y1="120" x2="720" y2="120" stroke="currentColor" stroke-width="0.8" opacity="0.5"/>
  <text x="64" y="116" opacity="0.6">0</text>

  <!-- Cyl 4: +48 then drifting to +60 -->
  <polyline fill="none" stroke="#14b8a6" stroke-width="2" points="70,62 110,66 150,60 190,64 230,61 270,65 310,62 350,63 390,61 430,64 470,60 510,58 550,55 590,52 630,48 670,45 710,42"/>
  <text x="716" y="46" fill="#14b8a6" font-weight="600">Cyl 4</text>
  <!-- Cyl 3: -7 -->
  <polyline fill="none" stroke="#a855f7" stroke-width="1.5" points="70,128 110,127 150,129 190,128 230,126 270,128 310,127 350,129 390,128 430,127 470,129 510,130 550,131 590,132 630,133 670,134 710,135"/>
  <text x="716" y="139" fill="#a855f7">Cyl 3</text>
  <!-- Cyl 2: -9 -->
  <polyline fill="none" stroke="#f97316" stroke-width="1.5" points="70,131 110,133 150,130 190,132 230,134 270,131 310,133 350,132 390,131 430,133 470,134 510,135 550,136 590,138 630,139 670,140 710,141"/>
  <text x="716" y="150" fill="#f97316">Cyl 2</text>
  <!-- Cyl 1: -32 -->
  <polyline fill="none" stroke="#3b82f6" stroke-width="1.5" points="70,158 110,156 150,159 190,157 230,160 270,158 310,157 350,159 390,158 430,160 470,161 510,162 550,163 590,164 630,165 670,166 710,167"/>
  <text x="716" y="171" fill="#3b82f6">Cyl 1</text>

  <!-- annotations -->
  <text x="250" y="90" text-anchor="middle" opacity="0.8">usual pattern: flat, parallel · Cyl 4 hottest (turbo exhaust)</text>
  <line x1="470" y1="30" x2="640" y2="30" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="470" y1="24" x2="470" y2="36" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="640" y1="24" x2="640" y2="36" stroke="#ef4444" stroke-width="1.2"/>
  <text x="555" y="22" text-anchor="middle" fill="#ef4444" font-weight="600">Cyl 4 drifting away from the others → worth a look</text>
  <text x="400" y="184" text-anchor="middle" opacity="0.6">the four lines always sum to zero: when one moves up, the others appear to move down</text>
</svg>
