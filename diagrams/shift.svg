<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="A metric over engine hours. Earlier flights form the reference with its average line; the most recent flights are highlighted as the recent window, and their average sits visibly higher than the reference average. That gap is a shift, even though no single recent flight is an outlier." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <line x1="60" y1="200" x2="730" y2="200" stroke="currentColor" stroke-width="1" marker-end="url(#arr5)"/>
  <line x1="60" y1="200" x2="60" y2="20" stroke="currentColor" stroke-width="1" marker-end="url(#arr5)"/>
  <text x="700" y="218" text-anchor="end" opacity="0.7">engine hours</text>
  <text x="18" y="30" opacity="0.7">metric</text>

  <!-- reference band (rolling, earlier flights) -->
  <rect x="60" y="108" width="470" height="44" fill="currentColor" opacity="0.10"/>
  <line x1="60" y1="130" x2="530" y2="130" stroke="currentColor" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="66" y="104" opacity="0.7">reference: earlier flights, average ± 1σ</text>

  <!-- recent window -->
  <rect x="540" y="30" width="180" height="170" fill="#14b8a6" opacity="0.12"/>
  <text x="630" y="46" text-anchor="middle" fill="#14b8a6" font-weight="600">recent window</text>
  <text x="630" y="60" text-anchor="middle" opacity="0.7">last 10 h · 5–15 flights</text>
  <line x1="548" y1="92" x2="712" y2="92" stroke="#14b8a6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="630" y="78" text-anchor="middle" fill="#14b8a6">recent average</text>

  <!-- shift arrow -->
  <line x1="535" y1="130" x2="535" y2="94" stroke="#ef4444" stroke-width="2" marker-end="url(#arr5)"/>
  <text x="520" y="116" text-anchor="end" fill="#ef4444" font-weight="600">shift</text>

  <!-- earlier flights -->
  <g fill="currentColor" opacity="0.8">
    <circle cx="85" cy="134" r="3.5"/><circle cx="115" cy="122" r="3.5"/><circle cx="145" cy="140" r="3.5"/>
    <circle cx="175" cy="128" r="3.5"/><circle cx="205" cy="118" r="3.5"/><circle cx="235" cy="136" r="3.5"/>
    <circle cx="265" cy="125" r="3.5"/><circle cx="295" cy="146" r="3.5"/><circle cx="325" cy="131" r="3.5"/>
    <circle cx="355" cy="114" r="3.5"/><circle cx="385" cy="138" r="3.5"/><circle cx="415" cy="127" r="3.5"/>
    <circle cx="445" cy="121" r="3.5"/><circle cx="475" cy="142" r="3.5"/><circle cx="505" cy="129" r="3.5"/>
  </g>
  <!-- recent flights: all within ±2σ but shifted -->
  <g fill="#14b8a6">
    <circle cx="555" cy="100" r="3.5"/><circle cx="580" cy="88" r="3.5"/><circle cx="605" cy="96" r="3.5"/>
    <circle cx="630" cy="84" r="3.5"/><circle cx="655" cy="98" r="3.5"/><circle cx="680" cy="90" r="3.5"/>
    <circle cx="705" cy="94" r="3.5"/>
  </g>
  <text x="400" y="190" text-anchor="middle" opacity="0.7">no single recent flight is an outlier — but together they have moved</text>
</svg>
