<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-label="A finding box with three arrows to Journal entry, Evidence package and Shared study, each described, and a dashed fourth arrow to a future shared detector built by owners." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/></marker></defs>
<rect x="40" y="90" width="190" height="60" rx="8" fill="#14b8a6" opacity="0.14"/>
<text x="135" y="114" text-anchor="middle" fill="#14b8a6" font-weight="600">a finding</text>
<text x="135" y="132" text-anchor="middle" opacity="0.8" font-size="10">sentence · evidence · magnitude · caveats</text>
<line x1="232" y1="120" x2="296" y2="52" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="300" y="30" width="420" height="46" rx="6" fill="currentColor" opacity="0.06"/>
<text x="312" y="49" font-weight="600">Journal entry</text>
<text x="312" y="66" opacity="0.8" font-size="10">the finding, dated, with your note — the record of what you decided</text>
<line x1="232" y1="120" x2="296" y2="122" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="300" y="100" width="420" height="46" rx="6" fill="currentColor" opacity="0.06"/>
<text x="312" y="119" font-weight="600">Evidence package</text>
<text x="312" y="136" opacity="0.8" font-size="10">one file: findings, magnitudes, caveats, per-slice tables — for a mechanic or manufacturer</text>
<line x1="232" y1="120" x2="296" y2="192" stroke="currentColor" stroke-width="1.2" marker-end="url(#ar)"/>
<rect x="300" y="170" width="420" height="46" rx="6" fill="currentColor" opacity="0.06"/>
<text x="312" y="189" font-weight="600">Shared study</text>
<text x="312" y="206" opacity="0.8" font-size="10">the rule and questions, for another owner to run on their flights</text>
<line x1="232" y1="120" x2="296" y2="262" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<rect x="300" y="240" width="420" height="58" rx="6" fill="none" stroke="#6b7280" stroke-dasharray="4 3"/>
<text x="312" y="259" fill="#6b7280" font-weight="600">future: a shared detector</text>
<text x="312" y="276" fill="#6b7280" font-size="10">the rule, with its author's explanation of what it may mean and what to do —</text>
<text x="312" y="289" fill="#6b7280" font-size="10">built and shared by owners, never shipped by the app</text>
<text x="40" y="318" opacity="0.7">nothing leaves Research by itself; a finding changes nothing elsewhere until you take it somewhere</text>
</svg>
