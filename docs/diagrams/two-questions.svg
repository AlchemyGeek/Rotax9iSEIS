<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" role="img" aria-label="One flight is checked two ways: against the Operators Manual limits, producing events, and against your own reference, producing insights." font-family="Inter, system-ui, sans-serif" font-size="12" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- the flight -->
  <rect x="20" y="85" width="160" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="100" y="110" text-anchor="middle" font-weight="600">One flight</text>
  <text x="100" y="128" text-anchor="middle" opacity="0.7" font-size="11">every reading, every second</text>

  <!-- upper branch: OM -->
  <line x1="180" y1="100" x2="300" y2="50" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="60" text-anchor="middle" opacity="0.8" font-size="11">checked against</text>
  <rect x="305" y="20" width="220" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="415" y="45" text-anchor="middle" font-weight="600">Operators Manual limits</text>
  <text x="415" y="63" text-anchor="middle" opacity="0.7" font-size="11">the same for every engine of your model</text>
  <line x1="525" y1="50" x2="595" y2="50" stroke="currentColor" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="42" text-anchor="middle" opacity="0.8" font-size="11">produces</text>
  <rect x="600" y="20" width="180" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="690" y="45" text-anchor="middle" font-weight="600">Events</text>
  <text x="690" y="63" text-anchor="middle" opacity="0.7" font-size="11">facts: when, how long, how far</text>

  <!-- lower branch: reference -->
  <line x1="180" y1="130" x2="300" y2="180" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="230" y="175" text-anchor="middle" opacity="0.8" font-size="11">compared with</text>
  <rect x="305" y="150" width="220" height="60" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="415" y="175" text-anchor="middle" font-weight="600">Your reference</text>
  <text x="415" y="193" text-anchor="middle" opacity="0.7" font-size="11">learned from your own flights</text>
  <line x1="525" y1="180" x2="595" y2="180" stroke="#14b8a6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="172" text-anchor="middle" opacity="0.8" font-size="11">produces</text>
  <rect x="600" y="150" width="180" height="60" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="690" y="175" text-anchor="middle" font-weight="600">Insights</text>
  <text x="690" y="193" text-anchor="middle" opacity="0.7" font-size="11">judgements: unusual for you?</text>
</svg>
