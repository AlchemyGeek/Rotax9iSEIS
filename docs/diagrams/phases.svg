<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="A flight timeline split into phases, with brackets above showing which phases feed which topics: cylinder balance uses cruise, boost at takeoff uses the takeoff roll, oil and coolant peaks use the whole flight, and the fuel pump test during taxi is not checked for fuel pressure." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- phase bar: x from 20 to 800 -->
  <g stroke="currentColor" stroke-width="0.5">
    <rect x="20"  y="150" width="40"  height="28" fill="#6b7280" opacity="0.55"/>
    <rect x="60"  y="150" width="20"  height="28" fill="#9ca3af" opacity="0.55"/>
    <rect x="80"  y="150" width="30"  height="28" fill="#a16207" opacity="0.55"/>
    <rect x="110" y="150" width="90"  height="28" fill="#78716c" opacity="0.55"/>
    <rect x="200" y="150" width="30"  height="28" fill="#6366f1" opacity="0.7"/>
    <rect x="230" y="150" width="110" height="28" fill="#22c55e" opacity="0.6"/>
    <rect x="340" y="150" width="260" height="28" fill="#3b82f6" opacity="0.6"/>
    <rect x="600" y="150" width="90"  height="28" fill="#a855f7" opacity="0.6"/>
    <rect x="690" y="150" width="60"  height="28" fill="#ec4899" opacity="0.6"/>
    <rect x="750" y="150" width="35"  height="28" fill="#14b8a6" opacity="0.6"/>
    <rect x="785" y="150" width="15"  height="28" fill="#6b7280" opacity="0.55"/>
  </g>
  <!-- phase labels, alternating rows to avoid overlap -->
  <g text-anchor="middle" opacity="0.85">
    <text x="40"  y="195">pre-start</text>
    <text x="70"  y="212">start</text>
    <text x="95"  y="195">warm-up</text>
    <text x="155" y="195">taxi</text>
    <text x="215" y="212">takeoff roll</text>
    <text x="285" y="195">climb</text>
    <text x="470" y="195">cruise</text>
    <text x="645" y="195">descent</text>
    <text x="720" y="212">approach</text>
    <text x="767" y="195">landing</text>
    <text x="792" y="228">shutdown</text>
  </g>
  <text x="20" y="243" opacity="0.6">time →</text>

  <!-- brackets above: what uses which phase -->
  <!-- whole flight -->
  <line x1="60" y1="30" x2="785" y2="30" stroke="currentColor" stroke-width="1.5"/>
  <line x1="60" y1="24" x2="60" y2="36" stroke="currentColor" stroke-width="1.5"/>
  <line x1="785" y1="24" x2="785" y2="36" stroke="currentColor" stroke-width="1.5"/>
  <text x="422" y="20" text-anchor="middle" font-weight="600">Oil and coolant peaks · time at takeoff power · OM limits (phase-aware)</text>

  <!-- cruise -->
  <line x1="340" y1="70" x2="600" y2="70" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="340" y1="64" x2="340" y2="76" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="600" y1="64" x2="600" y2="76" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="470" y="60" text-anchor="middle" font-weight="600">Cylinder balance · cylinder deviation · cruise fuel facts</text>

  <!-- takeoff roll -->
  <line x1="200" y1="110" x2="230" y2="110" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="200" y1="104" x2="200" y2="116" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="230" y1="104" x2="230" y2="116" stroke="#6366f1" stroke-width="1.5"/>
  <text x="215" y="100" text-anchor="middle" font-weight="600">Turbo boost at takeoff</text>

  <!-- taxi: pump test not checked -->
  <line x1="110" y1="135" x2="200" y2="135" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="155" y="128" text-anchor="middle" opacity="0.8">fuel pump test — fuel pressure max not checked</text>

  <!-- lane check marker -->
  <line x1="150" y1="150" x2="150" y2="178" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="150" y="226" text-anchor="middle" opacity="0.7">lane check (ENGINE ECU expected)</text>
</svg>
