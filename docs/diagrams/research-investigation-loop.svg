<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-label="The investigation loop. First the pilot looks at a flight in EIS with Signal on and marks a window for Claude with a note, under a question. In Claude Desktop the pilot asks — Investigate with no text takes the newest marked question — and steers. Claude works through the EIS tools on the pilot's computer: it looks at one flight, measures across all the flights with slices, the questions and code on the bench, reads the pilot's manuals and notes, and states a hypothesis with the alternatives it ruled out. Each step becomes a cell of a notebook kept in the EIS workspace, which the EIS pages show. The logs never leave the computer." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/></marker></defs>
<rect x="20" y="14" width="720" height="50" rx="8" fill="#14b8a6" opacity="0.06"/>
<rect x="20" y="14" width="720" height="50" rx="8" fill="none" stroke="#14b8a6" opacity="0.6"/>
<text x="38" y="35" font-weight="600">You look and mark, in EIS</text>
<text x="38" y="52" opacity="0.8" font-size="10">a flight with Signal on · zoom to what looks odd · Mark for Claude: the window, your note, a question</text>
<text x="722" y="43" text-anchor="end" opacity="0.7" font-size="10">Research → Inbox keeps your questions</text>
<line x1="272" y1="64" x2="272" y2="146" stroke="#14b8a6" marker-end="url(#art)"/>
<g transform="translate(0,70)">
<rect x="20" y="20" width="170" height="266" rx="8" fill="currentColor" opacity="0.05"/>
<text x="105" y="42" text-anchor="middle" font-weight="600">Claude Desktop</text>
<text x="105" y="58" text-anchor="middle" opacity="0.7" font-size="10">your account, your conversation</text>
<rect x="38" y="78" width="134" height="52" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
<text x="105" y="99" text-anchor="middle" font-weight="600">You ask</text>
<text x="105" y="116" text-anchor="middle" opacity="0.8" font-size="10">“look into my marks”</text>
<rect x="38" y="150" width="134" height="52" rx="6" fill="none" stroke="currentColor" opacity="0.7"/>
<text x="105" y="171" text-anchor="middle" font-weight="600">You steer</text>
<text x="105" y="188" text-anchor="middle" opacity="0.8" font-size="10">“compare every takeoff”</text>
<text x="105" y="232" text-anchor="middle" opacity="0.7" font-size="10">Claude decides what to do next</text>
<text x="105" y="246" text-anchor="middle" opacity="0.7" font-size="10">and says what it is doing</text>
<rect x="225" y="20" width="515" height="266" rx="8" fill="#14b8a6" opacity="0.06"/>
<text x="482" y="42" text-anchor="middle" font-weight="600">EIS on your computer — the instrument</text>
<g font-size="10.5">
<rect x="245" y="78" width="110" height="64" rx="6" fill="none" stroke="#14b8a6"/>
<text x="300" y="98" text-anchor="middle" font-weight="600">Look</text>
<text x="300" y="114" text-anchor="middle" opacity="0.8">one flight first:</text>
<text x="300" y="128" text-anchor="middle" opacity="0.8">a log view, its signal</text>
<rect x="373" y="78" width="110" height="64" rx="6" fill="none" stroke="#14b8a6"/>
<text x="428" y="98" text-anchor="middle" font-weight="600">Measure</text>
<text x="428" y="114" text-anchor="middle" opacity="0.8">across the flights:</text>
<text x="428" y="128" text-anchor="middle" opacity="0.8">slices, tests, code</text>
<rect x="501" y="78" width="110" height="64" rx="6" fill="none" stroke="#14b8a6"/>
<text x="556" y="98" text-anchor="middle" font-weight="600">Read</text>
<text x="556" y="114" text-anchor="middle" opacity="0.8">your manuals,</text>
<text x="556" y="128" text-anchor="middle" opacity="0.8">your aircraft notes</text>
<rect x="629" y="78" width="96" height="64" rx="6" fill="none" stroke="#14b8a6"/>
<text x="677" y="98" text-anchor="middle" font-weight="600">Explain</text>
<text x="677" y="114" text-anchor="middle" opacity="0.8">a hypothesis,</text>
<text x="677" y="128" text-anchor="middle" opacity="0.8">alternatives ruled out</text>
</g>
<line x1="355" y1="110" x2="371" y2="110" stroke="#14b8a6" marker-end="url(#art)"/>
<line x1="483" y1="110" x2="499" y2="110" stroke="#14b8a6" marker-end="url(#art)"/>
<line x1="611" y1="110" x2="627" y2="110" stroke="#14b8a6" marker-end="url(#art)"/>
<path d="M677,78 C677,60 300,60 300,76" fill="none" stroke="#14b8a6" stroke-dasharray="4 3" opacity="0.7" marker-end="url(#art)"/>
<text x="488" y="62" text-anchor="middle" fill="#14b8a6" font-size="10">again, until the question is answered</text>
<rect x="245" y="176" width="480" height="44" rx="6" fill="currentColor" opacity="0.06"/>
<text x="485" y="195" text-anchor="middle" font-weight="600">The notebook, in your workspace</text>
<text x="485" y="211" text-anchor="middle" opacity="0.8" font-size="10">each step a cell: what was done, its output, what it means</text>
<line x1="300" y1="142" x2="300" y2="174" stroke="currentColor" opacity="0.6" marker-end="url(#ar)"/>
<line x1="428" y1="142" x2="428" y2="174" stroke="currentColor" opacity="0.6" marker-end="url(#ar)"/>
<line x1="556" y1="142" x2="556" y2="174" stroke="currentColor" opacity="0.6" marker-end="url(#ar)"/>
<line x1="677" y1="142" x2="677" y2="174" stroke="currentColor" opacity="0.6" marker-end="url(#ar)"/>
<rect x="245" y="236" width="480" height="34" rx="6" fill="none" stroke="currentColor" stroke-dasharray="3 3" opacity="0.5"/>
<text x="485" y="257" text-anchor="middle" opacity="0.8" font-size="10">your logs and workspace — read by the engine, never sent anywhere</text>
<line x1="172" y1="104" x2="243" y2="110" stroke="currentColor" marker-end="url(#ar)"/>
<line x1="172" y1="176" x2="243" y2="198" stroke="currentColor" marker-end="url(#ar)"/>
<line x1="243" y1="206" x2="174" y2="212" stroke="currentColor" opacity="0.6" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<text x="208" y="222" text-anchor="middle" opacity="0.7" font-size="9.5">results</text>
<text x="390" y="316" text-anchor="middle" opacity="0.7" font-size="10">Claude calls tools; it never opens a log file. The numbers in the notebook are the engine's.</text>
</g>
</svg>
