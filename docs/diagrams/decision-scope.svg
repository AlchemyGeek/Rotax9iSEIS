<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" role="img" aria-label="Decisions grouped by scope. This flight only: exclude from reference, acknowledge an insight, annotate. All flights in the workspace: filter a limit, edit a topic's rules, disable a topic, pin a reference. Every one is listed in the Journal, and filters are kept under watch." font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- this flight -->
  <rect x="20" y="30" width="250" height="130" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="145" y="52" text-anchor="middle" font-weight="600">This flight only</text>
  <text x="145" y="67" text-anchor="middle" opacity="0.7">a statement about one flight</text>
  <text x="36" y="95">• Exclude from the reference (with a reason)</text>
  <text x="36" y="115">• Annotate an event or the flight</text>
  <text x="36" y="135" opacity="0.7">• Acknowledge one insight (planned)</text>

  <!-- all flights -->
  <rect x="300" y="30" width="300" height="130" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="450" y="52" text-anchor="middle" font-weight="600">All flights in this workspace</text>
  <text x="450" y="67" text-anchor="middle" opacity="0.7">a statement about your engine · past and future flights</text>
  <text x="316" y="95">• Filter a limit (magnitude · duration · phases)</text>
  <text x="316" y="115">• Edit a topic's triggers · disable a topic</text>
  <text x="316" y="135">• Pin a metric's reference</text>

  <!-- journal -->
  <rect x="630" y="30" width="110" height="130" rx="8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="685" y="52" text-anchor="middle" font-weight="600">Journal</text>
  <text x="685" y="80" text-anchor="middle" opacity="0.8">every decision</text>
  <text x="685" y="95" text-anchor="middle" opacity="0.8">in force</text>
  <text x="685" y="120" text-anchor="middle" opacity="0.8">live effect</text>
  <text x="685" y="135" text-anchor="middle" opacity="0.8">reversible</text>
  <line x1="270" y1="95" x2="300" y2="95" stroke="currentColor" stroke-width="0" />
  <line x1="600" y1="95" x2="625" y2="95" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr4)"/>
  <line x1="145" y1="160" x2="145" y2="185" stroke="currentColor" stroke-width="1.2"/>
  <line x1="145" y1="185" x2="685" y2="185" stroke="currentColor" stroke-width="1.2"/>
  <line x1="685" y1="185" x2="685" y2="165" stroke="currentColor" stroke-width="1.2" marker-end="url(#arr4)"/>
  <text x="415" y="180" text-anchor="middle" opacity="0.7">listed</text>

  <!-- watch note -->
  <text x="450" y="210" text-anchor="middle" fill="#14b8a6">A filtered limit stays watched: the app reports when the pattern changes.</text>
</svg>
