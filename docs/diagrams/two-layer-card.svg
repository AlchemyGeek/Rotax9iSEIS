<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 210" role="img" aria-label="Two topic cards side by side. Both have an analysis line: this flight's number, your average and the OM limit. Only the right-hand card has a second line, an insight, because a trigger fired." font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="currentColor" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- card A: nothing to add -->
  <rect x="20" y="20" width="360" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <text x="34" y="42" font-weight="600">Oil temperature peak</text>
  <text x="34" y="62" font-family="JetBrains Mono, monospace" font-size="10.5">Peak 183°F · Your avg 201 ± 12°F (47 flights) · OM 248°F</text>
  <text x="34" y="100" opacity="0.7">Ordinary flight on this topic: the card stays on its one line.</text>

  <!-- card B: insight -->
  <rect x="400" y="20" width="380" height="150" rx="8" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="414" y="42" font-weight="600">Cylinder balance (EGT spread)</text>
  <text x="414" y="62" font-family="JetBrains Mono, monospace" font-size="10.5">Spread 84°F · Your avg 61 ± 6°F (47 flights) · OM 392°F</text>
  <line x1="414" y1="74" x2="766" y2="74" stroke="currentColor" stroke-width="0.6" opacity="0.4"/>
  <rect x="414" y="84" width="48" height="16" rx="3" fill="#eab308" opacity="0.85"/>
  <text x="438" y="96" text-anchor="middle" font-size="9.5" font-weight="700" fill="#111">WATCH</text>
  <text x="414" y="120">Wider than your usual on mild days: 84°F vs 61 ± 6°F.</text>
  <text x="414" y="136" opacity="0.8">A widening spread can point to an injector, plug or ignition.</text>
  <text x="414" y="158" fill="#14b8a6">View evidence →   Exclude from reference →   Edit trigger ↓</text>

  <!-- annotations -->
  <text x="190" y="128" text-anchor="middle" font-weight="600">Analysis line</text>
  <text x="190" y="143" text-anchor="middle" opacity="0.7">always present · descriptive</text>
  <text x="190" y="178" text-anchor="middle" font-weight="600">Insight</text>
  <text x="190" y="193" text-anchor="middle" opacity="0.7">only when a trigger fires · judgement</text>
  <line x1="260" y1="124" x2="400" y2="60" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
  <line x1="260" y1="176" x2="400" y2="118" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6"/>
</svg>
