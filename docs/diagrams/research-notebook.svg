<text x="526" y="343" opacity="0.8">the number, with its reference</text>
</g>
<text x="616" y="372" text-anchor="middle" opacity="0.7" font-size="10">One .ipynb file: the Research page,</text>
<text x="616" y="386" text-anchor="middle" opacity="0.7" font-size="10">JupyterLab, an exported page</text>
</svg>
