<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="An investigation notebook. At the top, its header: the question, who wrote it, whether it is finished, the engine version and whether its outputs are current for this workspace, then the summary. Below, cells in order: the setup cell that binds eis to the workspace, markdown saying what comes next, a log-view cell that EIS shows as the Flight view's chart and Jupyter shows as a picture, a code cell whose code is folded away and whose output states a number, and more markdown saying what it means. The same file opens on the Research page, in JupyterLab, and as an exported page." font-family="Inter, system-ui, sans-serif" font-size="11" fill="currentColor">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="16" width="460" height="370" rx="8" fill="currentColor" opacity="0.05"/>
<text x="38" y="40" font-weight="600" font-size="13">Full-power rpm cycle</text>
<text x="38" y="57" opacity="0.75" font-size="10">by claude · finished · engine 1.0.2 · outputs current for this workspace</text>
<text x="38" y="74" font-size="10.5"><tspan font-weight="600">Question:</tspan> does rpm cycle at full power, on every flight?</text>
<rect x="38" y="84" width="424" height="30" rx="4" fill="#14b8a6" opacity="0.1"/>
<text x="48" y="103" font-size="10.5"><tspan font-weight="600">Summary:</tspan> what was found, what it means, what to do</text>
<rect x="38" y="124" width="424" height="22" rx="4" fill="none" stroke="currentColor" opacity="0.4" stroke-dasharray="3 3"/>
<text x="48" y="139" opacity="0.75" font-size="10">▸ show code (setup: binds eis to this workspace)</text>
<text x="38" y="166" font-weight="600">One flight first</text>
<text x="38" y="181" opacity="0.8" font-size="10.5">The minute of full power on 1 January, rpm and manifold pressure.</text>
<rect x="38" y="192" width="424" height="78" rx="4" fill="none" stroke="#14b8a6"/>
<path d="M50,232 L60,220 L70,244 L80,220 L90,244 L100,220 L110,244 L120,220 L130,244 L140,220 L150,244 L160,220 L170,244 L180,220 L190,244 L200,220 L210,244 L220,220 L230,244 L240,220 L250,244 L260,220 L270,244 L280,220 L290,244 L300,220 L310,244 L320,232" fill="none" stroke="#14b8a6" stroke-width="1.4"/>
<path d="M50,256 L60,250 L70,262 L80,250 L90,262 L100,250 L110,262 L120,250 L130,262 L140,250 L150,262 L160,250 L170,262 L180,250 L190,262 L200,250 L210,262 L220,250 L230,262 L240,250 L250,262 L260,250 L270,262 L280,250 L290,262 L300,250 L310,262 L320,256" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7"/>
<rect x="378" y="200" width="74" height="20" rx="4" fill="none" stroke="currentColor" opacity="0.6"/>
<text x="415" y="214" text-anchor="middle" font-size="10">Open flight</text>
<text x="340" y="236" font-size="10" fill="#14b8a6">rpm</text>
<text x="340" y="260" font-size="10" opacity="0.8">MAP</text>
<text x="38" y="292" font-weight="600">Across the flights</text>
<rect x="38" y="300" width="424" height="22" rx="4" fill="none" stroke="currentColor" opacity="0.4" stroke-dasharray="3 3"/>
<text x="48" y="315" opacity="0.75" font-size="10">▸ show code</text>
<text x="48" y="340" font-family="ui-monospace, Menlo, monospace" font-size="10">RPM cycles every 4.4 s in 10 of 10 slices, swing 180 rpm …</text>
<text x="38" y="368" opacity="0.8" font-size="10.5">What it means — a markdown cell beside every figure and log view.</text>
<g font-size="10.5">
<line x1="482" y1="60" x2="520" y2="60" stroke="currentColor" opacity="0.5" marker-end="url(#ar)"/>
<text x="526" y="56" font-weight="600">The header</text>
<text x="526" y="71" opacity="0.8">who, the question, finished or open,</text>
<text x="526" y="85" opacity="0.8">and whether the outputs still hold here</text>
<line x1="482" y1="135" x2="520" y2="135" stroke="currentColor" opacity="0.5" marker-end="url(#ar)"/>
<text x="526" y="131" font-weight="600">The setup cell</text>
<text x="526" y="146" opacity="0.8">so the notebook runs in JupyterLab too</text>
<line x1="482" y1="230" x2="520" y2="230" stroke="#14b8a6" marker-end="url(#ar)"/>
<text x="526" y="214" font-weight="600">A log view</text>
<text x="526" y="229" opacity="0.8">in EIS: the Flight view's chart, live;</text>
<text x="526" y="243" opacity="0.8">in Jupyter or a PDF: the same as a picture;</text>
